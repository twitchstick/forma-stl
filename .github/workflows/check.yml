name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_makerworld_client.cjs
      - run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - run: node tests/test_websites_client.cjs
      - run: node tests/test_catalog_client.cjs
      - run: node tests/test_source_client.cjs
      - run: node tests/test_collection_schedule_client.cjs
      - run: node tests/test_slicer_client.cjs
      - run: node tests/test_account_client.cjs
      - name: Build Docker image
        run: docker build -t forma:test .
      - name: Check container startup
        run: |
          docker run -d --name forma-test -p 8085:8080 forma:test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8085/health; then exit 0; fi
            sleep 1
          done
          docker logs forma-test
          exit 1
