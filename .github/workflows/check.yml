name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt ruff==0.17.4
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check --select F,E9 .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - name: JavaScript tests
        run: for t in tests/*.cjs; do echo "$t"; node "$t"; done
      - name: Build Docker image
        run: docker build -t forma:test .
      - name: Check container startup
        run: |
          docker run -d --name forma-test -p 8085:8080 -e FORMA_PASSWORD=ci-test-password forma:test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8085/health; then exit 0; fi
            sleep 1
          done
          docker logs forma-test
          exit 1
  publish:
    # Publish the tested image so Unraid's "Apply update" can pull it.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
